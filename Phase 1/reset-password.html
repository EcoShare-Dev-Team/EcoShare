<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Reset your EcoShare account password." />

    <meta name="theme-color" content="#538d22" />

    <meta name="color-scheme" content="light" />

    <title>Reset Password | EcoShare</title>

    <!-- Global Design System -->
    <link rel="stylesheet" href="page.css" />

    <!-- Reset Password Page Styles -->
    <link rel="stylesheet" href="reset-password.css" />
  </head>

  <body>
    <!-- Accessibility -->
    <a href="#resetMain" class="skip-link"> Skip to password reset form </a>

    <main id="resetMain" class="reset-page">
      <section class="reset-card" aria-labelledby="resetTitle">
        <!-- =====================================================
                 HEADER
                 ===================================================== -->

        <header class="reset-header">
          <a
            href="../index.html"
            class="reset-brand"
            aria-label="EcoShare Home"
          >
            <img
              id="resetLogo"
              src="https://cplbvftcbiwgqkeqmrbq.supabase.co/storage/v1/object/public/site-assets/logo.png"
              alt="EcoShare"
              class="logo"
              width="110"
              height="110"
              decoding="async"
            />
          </a>

          <h1 id="resetTitle">Reset Password</h1>

          <p>Create a new password for your EcoShare account.</p>
        </header>

        <!-- =====================================================
                 STATUS MESSAGE
                 ===================================================== -->

        <div
          id="message"
          class="form-message"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <!-- =====================================================
                 RESET PASSWORD FORM
                 ===================================================== -->

        <form
          id="resetPasswordForm"
          novalidate
          autocomplete="off"
          aria-describedby="message"
        >
          <!-- New Password -->
          <div class="form-group">
            <label for="newPassword"> New Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
                aria-describedby="passwordRequirements"
              />

              <button
                type="button"
                id="toggleNewPassword"
                class="password-toggle"
                aria-label="Show password"
                aria-controls="newPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <p id="passwordRequirements" class="field-help">
              Use at least 8 characters with uppercase, lowercase, a number, and
              a special character.
            </p>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword"> Confirm New Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
                aria-describedby="confirmPasswordHelp"
              />

              <button
                type="button"
                id="toggleConfirmPassword"
                class="password-toggle"
                aria-label="Show password"
                aria-controls="confirmPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <p id="confirmPasswordHelp" class="field-help">
              Enter the same password again.
            </p>
          </div>

          <!-- Submit -->
          <button type="submit" id="resetButton" class="reset-button">
            Update Password
          </button>
        </form>

        <!-- =====================================================
                 BACK TO LOGIN
                 ===================================================== -->

        <div class="back-login">
          <a href="login.html"> Back to Login </a>
        </div>
      </section>
    </main>

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Shared Supabase Client -->
    <script src="supabase.js"></script>

    <!-- Reset Password Logic -->
    <script src="reset-password.js"></script>
  </body>
</html>
